server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Posts API images allow up to 10 files x 5MB each.
    client_max_body_size 60m;

    # Docker's embedded DNS. Resolving via a variable defers lookup to
    # request time, so nginx still starts (and serves the static site)
    # even if the `api` container isn't up yet or gets restarted.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api:8787;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Posts and images now live in the posts_data volume, not the image.
    # rss.xml/sitemap.xml are generated on-demand by the api from that volume.
    location = /rss.xml {
        set $api_upstream api:8787;
        proxy_pass http://$api_upstream/rss.xml;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        set $api_upstream api:8787;
        proxy_pass http://$api_upstream/sitemap.xml;
        proxy_set_header Host $host;
    }

    # ^~ stops nginx from falling through to the extension-based regex
    # location below, which would otherwise serve from the static build
    # instead of the posts_data volume mounted at /data.
    location ^~ /images/posts/ {
        alias /data/images/posts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
