services:
  blog:
    image: ghcr.io/vmhq/vmhq-blog:latest
    ports:
      - "9845:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "8787"
    environment:
      BLOG_API_TOKEN: ${BLOG_API_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-vmhq/vmhq-blog}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      SITE_URL: ${SITE_URL:-https://blog.vmhq.cl}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
