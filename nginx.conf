server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Posts API images allow up to 10 files x 5MB each.
    client_max_body_size 60m;

    # Docker's embedded DNS. Resolving via a variable defers lookup to
    # request time, so nginx still starts (and serves the static site)
    # even if the `api` container isn't up yet or gets restarted.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api:8787;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
